services:
  - type: web
    name: beauty-catalogue
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    # No dockerCommand: the Dockerfile CMD runs through a shell so ${PORT}
    # expands. A dockerCommand here would not expand it and the port bind
    # would fail.
    healthCheckPath: /
    envVars:
      - key: HOSTED_DASHBOARD
        value: "true"
      # The public URL exposes the dashboard, so the app refuses to serve
      # until this is set. Only the web service needs it.
      - key: APP_PASSWORD
        sync: false
      # Comma-separated brand allowlist, entered per environment. Leave the
      # prompt blank to keep every brand the retailer returns.
      - key: SCRAPE_BRANDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_RUNS_TABLE
        value: retailer_scrape_runs
      # Needed by the dashboard. Amazon is not hosted: the image has no
      # Playwright browsers, so it offers Nykaa and Tira only.
      - key: NYKAA_CURL_COMMAND
        sync: false
      - key: TIRA_APPLICATION_ID
        sync: false
      - key: TIRA_APPLICATION_TOKEN
        sync: false

  - type: cron
    name: beauty-nykaa-nightly
    runtime: docker
    plan: starter
    schedule: "0 19 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m pricing_scraper.scheduler --site nykaa --config config.yaml
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_SYNC_REQUIRED
        value: "true"
      - key: SUPABASE_RUNS_TABLE
        value: retailer_scrape_runs
      - key: SCRAPE_BRANDS
        sync: false
      - key: NYKAA_CURL_COMMAND
        sync: false

  - type: cron
    name: beauty-tira-nightly
    runtime: docker
    plan: starter
    schedule: "0 20 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m pricing_scraper.scheduler --site tira --config config.yaml
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_SYNC_REQUIRED
        value: "true"
      - key: SUPABASE_RUNS_TABLE
        value: retailer_scrape_runs
      - key: SCRAPE_BRANDS
        sync: false
      - key: TIRA_APPLICATION_ID
        sync: false
      - key: TIRA_APPLICATION_TOKEN
        sync: false
