[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beauty-pricing-scraper"
version = "0.1.0"
description = "Config-driven beauty and skincare pricing scraper"
requires-python = ">=3.11"
dependencies = [
  "requests",
  "PyYAML",
  "openpyxl",
  "streamlit>=1.57",
]

[project.scripts]
beauty-prices = "pricing_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["pricing_scraper*"]
